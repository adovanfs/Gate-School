<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23000'/%3E%3Cpath d='M140 140 L140 372 L256 372 L256 300 L216 300 L216 268 L280 268 L280 372 L372 372 L372 140 L140 140 Z M216 216 L296 216 L296 244 L216 244 L216 216 Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--bg-soft:#0a0a0a;--bg-elev:#141414;--card:rgba(255,255,255,.03);--card-h:rgba(255,255,255,.06);--fg:#f5f5f7;--fg-soft:#a1a1a6;--fg-muted:#6e6e73;--border:rgba(255,255,255,.08);--border-s:rgba(255,255,255,.16);--accent:#fff;--accent-fg:#000;--glow:rgba(255,255,255,.2);--success:#30d158;--warning:#ffd60a;--danger:#ff453a;--info:#0a84ff;--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;--serif:'New York','Playfair Display',Georgia,serif;--mono:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
[data-theme=light]{--bg:#fafafa;--bg-soft:#f5f5f7;--bg-elev:#fff;--card:rgba(0,0,0,.02);--card-h:rgba(0,0,0,.05);--fg:#1d1d1f;--fg-soft:#6e6e73;--fg-muted:#a1a1a6;--border:rgba(0,0,0,.08);--border-s:rgba(0,0,0,.16);--accent:#000;--accent-fg:#fff;--glow:rgba(0,0,0,.15)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s var(--ease),color .3s var(--ease);min-height:100vh;display:flex;flex-direction:column}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.bg-3d{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 20s ease-in-out infinite}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(120,80,255,.35),transparent 70%);top:-200px;left:-100px}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(80,200,255,.25),transparent 70%);bottom:-150px;right:-100px;animation-delay:-7s}
.orb3{width:350px;height:350px;background:radial-gradient(circle,rgba(255,100,150,.2),transparent 70%);top:40%;right:20%;animation-delay:-14s}
[data-theme=light] .orb{opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,60px) scale(.95)}}
header{position:sticky;top:0;z-index:50;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);background:rgba(0,0,0,.72);border-bottom:1px solid transparent;transition:all .3s var(--ease)}
[data-theme=light] header{background:rgba(250,250,250,.72)}
header.scrolled{border-bottom-color:var(--border);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 20px;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.brand-logo{width:28px;height:28px;transition:transform .5s var(--spring)}
.brand:hover .brand-logo{transform:rotateY(180deg)}
.nav{display:flex;gap:4px;align-items:center}
.nav a{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--fg-soft);transition:all .2s var(--ease)}
.nav a:hover{color:var(--fg);background:var(--card-h)}
.nav a.on{color:var(--fg);background:var(--card)}
.hd-actions{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg-soft);transition:all .2s var(--ease);font-size:15px}
.icon-btn:hover{background:var(--card-h);color:var(--fg);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
main{flex:1;position:relative;z-index:2}
.container{width:100%;max-width:1080px;margin:0 auto;padding:0 24px}
.hero{padding:100px 24px 80px;text-align:center;overflow:hidden;position:relative;z-index:2}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--fg-soft);margin-bottom:28px;backdrop-filter:blur(20px)}
.badge-dot{width:18px;height:18px;border-radius:50%;background:var(--success);box-shadow:0 0 12px var(--success);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.hero h1{font-size:clamp(2.5rem,8vw,5.5rem);font-weight:700;letter-spacing:-.045em;line-height:1.02;margin-bottom:24px;background:linear-gradient(180deg,var(--fg) 30%,var(--fg-muted));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;will-change:transform}
.hero h1 em{font-style:italic;font-family:var(--serif);font-weight:400}
.hero-sub{font-size:clamp(1.05rem,2vw,1.35rem);color:var(--fg-soft);max-width:640px;margin:0 auto 40px;line-height:1.5;will-change:transform}
.hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;will-change:transform}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:-.01em;transition:all .25s var(--ease);white-space:nowrap;cursor:pointer;border:1px solid transparent}
.btn-p{background:var(--accent);color:var(--accent-fg)}
.btn-p:hover{box-shadow:0 0 0 6px var(--glow);transform:translateY(-2px)}
.btn-g{background:transparent;color:var(--fg);border-color:var(--border-s)}
.btn-g:hover{background:var(--card-h);border-color:var(--fg-soft);transform:translateY(-2px)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px}
.stack{position:relative;perspective:1400px;width:100%;height:380px;margin:60px auto 0;max-width:640px;z-index:2;will-change:transform}
.stack-card{position:absolute;inset:0;border-radius:32px;background:linear-gradient(135deg,var(--bg-elev),var(--bg-soft));border:1px solid var(--border-s);padding:36px 32px;display:flex;flex-direction:column;justify-content:space-between;transform-style:preserve-3d;box-shadow:0 30px 60px rgba(0,0,0,.4);transition:transform .9s var(--ease)}
.stack-card:nth-child(1){transform:rotateY(-18deg) rotateX(8deg) translateZ(-60px) translateX(-60px);opacity:.85}
.stack-card:nth-child(2){transform:rotateY(-9deg) rotateX(4deg) translateZ(-30px) translateX(-30px);opacity:.92}
.stack-card:nth-child(3){animation:tilt 8s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotateY(0) rotateX(0) translateZ(0)}50%{transform:rotateY(3deg) rotateX(-2deg) translateZ(20px)}}
.stack-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted)}
.stack-title{font-size:1.8rem;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:auto}
.stack-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--fg-soft);margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px;margin:40px auto 0}
.stat{text-align:center;padding:24px 16px;border-radius:22px;background:var(--card);border:1px solid var(--border);backdrop-filter:blur(20px)}
.stat-val{font-size:2rem;font-weight:700;letter-spacing:-.04em;line-height:1;margin-bottom:6px}
.stat-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
.section{padding:80px 0;position:relative;z-index:2}
.sec-head{text-align:center;margin-bottom:56px}
.sec-eye{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:12px}
.sec-title{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-bottom:12px}
.sec-sub{color:var(--fg-soft);font-size:1.05rem;max-width:560px;margin:0 auto;line-height:1.55}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lvl{position:relative;padding:28px;border-radius:22px;background:var(--card);border:1px solid var(--border);backdrop-filter:blur(20px);transition:all .35s var(--ease);cursor:pointer;overflow:hidden}
.lvl:hover{transform:translateY(-4px);background:var(--card-h);border-color:var(--border-s);box-shadow:0 20px 40px rgba(0,0,0,.3)}
.lvl-num{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--fg-muted);letter-spacing:.08em;margin-bottom:20px}
.lvl-title{font-size:1.25rem;font-weight:700;letter-spacing:-.025em;margin-bottom:8px}
.lvl-desc{font-size:14px;color:var(--fg-soft);line-height:1.5;margin-bottom:20px;min-height:42px}
.lvl-prog{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:4px;border-radius:999px;background:var(--border);overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:inherit;transition:width .6s var(--ease)}
.bar-txt{font-size:12px;font-weight:600;color:var(--fg-soft);min-width:36px;text-align:right}
.lesson{max-width:720px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:2}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-muted);margin-bottom:24px;flex-wrap:wrap}
.crumb a:hover{color:var(--fg)}
.lesson h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-bottom:16px}
.lesson-meta{display:flex;gap:12px;font-size:13px;color:var(--fg-muted);margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.bookmark-btn{margin-left:auto;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--border);color:var(--fg-soft);transition:all .2s var(--ease);display:inline-flex;align-items:center;gap:6px}
.bookmark-btn:hover{color:var(--fg);border-color:var(--border-s)}
.bookmark-btn.on{color:var(--warning);border-color:var(--warning)}
.prose{font-size:17px;line-height:1.75;color:var(--fg-soft)}
.prose h1,.prose h2,.prose h3{color:var(--fg);font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:2em 0 .75em}
.prose h2{font-size:1.6rem}.prose h3{font-size:1.2rem}
.prose p{margin-bottom:1.25em}
.prose strong{color:var(--fg);font-weight:600}
.prose em{font-family:var(--serif);font-style:italic;font-size:1.05em}
.prose a{color:var(--fg);border-bottom:1px solid var(--border-s)}
.prose ul,.prose ol{margin:0 0 1.25em 1.25em;padding-left:.5em}
.prose li{margin-bottom:.5em}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--card-h);padding:2px 6px;border-radius:6px;color:var(--fg)}
.prose pre{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:20px;overflow-x:auto;margin:0 0 1.5em;font-size:14px;line-height:1.6}
.prose pre code{background:none;padding:0;color:var(--fg)}
.prose blockquote{border-left:3px solid var(--border-s);padding:4px 0 4px 20px;margin:0 0 1.5em;font-family:var(--serif);font-style:italic;font-size:1.1em;color:var(--fg)}
.prompt-block{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;margin:0 0 1.5em;overflow:hidden}
.prompt-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card)}
.prompt-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
.prompt-copy{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--fg-soft)}
.prompt-copy:hover{color:var(--fg);border-color:var(--border-s);background:var(--card-h)}
.prompt-body{padding:18px 20px;font-family:var(--mono);font-size:14px;line-height:1.65;color:var(--fg);white-space:pre-wrap;word-break:break-word}
.pg{margin:40px 0;padding:24px;border-radius:22px;background:var(--bg-elev);border:1px solid var(--border)}
.pg-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pg-dot{width:10px;height:10px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
.pg-title{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-soft)}
.pg textarea{width:100%;min-height:140px;padding:16px;border-radius:16px;background:var(--bg);border:1px solid var(--border);font-family:var(--mono);font-size:14px;line-height:1.65;resize:vertical;color:var(--fg)}
.pg textarea:focus{border-color:var(--border-s);outline:none}
.pg-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px;flex-wrap:wrap}
.pg-hint{font-size:12px;color:var(--fg-muted)}
.quiz{margin:40px 0;padding:28px;border-radius:22px;background:var(--card);border:1px solid var(--border)}
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.quiz-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
.quiz-count{font-size:12px;font-family:var(--mono);color:var(--fg-muted)}
.quiz-q{font-size:1.1rem;font-weight:600;line-height:1.4;margin-bottom:20px;color:var(--fg)}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;background:var(--bg);border:1px solid var(--border);text-align:left;font-size:14.5px;color:var(--fg-soft);transition:all .2s var(--ease);cursor:pointer}
.quiz-opt:hover:not(.right):not(.wrong){border-color:var(--border-s);color:var(--fg);background:var(--card)}
.quiz-opt.right{border-color:var(--success);background:rgba(48,209,88,.08);color:var(--fg)}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(255,69,58,.08);color:var(--fg)}
.quiz-marker{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-s);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;color:var(--fg-muted)}
.quiz-opt.right .quiz-marker{border-color:var(--success);background:var(--success);color:#000}
.quiz-opt.wrong .quiz-marker{border-color:var(--danger);background:var(--danger);color:#fff}
.quiz-footer{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.quiz-fb{font-size:14px;color:var(--fg-soft)}
.quiz-fb.ok{color:var(--success)}.quiz-fb.no{color:var(--danger)}
.complete{margin:40px 0;padding:28px;border-radius:22px;background:var(--card);border:1px solid var(--border);text-align:center}
.complete h3{font-size:1.1rem;margin-bottom:8px;color:var(--fg)}
.complete p{color:var(--fg-soft);font-size:14px;margin-bottom:20px}
.nav-btns{display:flex;justify-content:space-between;gap:12px;margin-top:60px;padding-top:32px;border-top:1px solid var(--border)}
.nav-btn{display:flex;flex-direction:column;gap:4px;padding:16px 20px;border-radius:16px;border:1px solid var(--border);background:var(--card);flex:1;max-width:48%;text-align:left;color:var(--fg);transition:all .25s var(--ease)}
.nav-btn:hover{border-color:var(--border-s);background:var(--card-h);transform:translateY(-2px)}
.nav-btn.next{text-align:right;margin-left:auto}
.nav-lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
.nav-tit{font-size:14px;font-weight:600}
.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson-row{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:16px;background:var(--card);border:1px solid var(--border);text-align:left;transition:all .25s var(--ease);width:100%;cursor:pointer;color:var(--fg)}
.lesson-row:hover{background:var(--card-h);transform:translateY(-2px);border-color:var(--border-s)}
.lesson-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--border-s);font-size:12px;font-weight:600;color:var(--fg-muted);flex-shrink:0;font-family:var(--mono)}
.lesson-num.done{background:var(--success);border:none;color:#000}
.lesson-tit{flex:1;font-weight:500;color:var(--fg);font-size:15px}
.lesson-arrow{color:var(--fg-muted);font-size:13px}
.stat-row{display:flex;align-items:center;gap:24px;padding:28px;border-radius:22px;background:var(--card);border:1px solid var(--border);margin-bottom:32px}
.ring{position:relative;width:100px;height:100px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--fg)}
.footer{position:relative;z-index:2;margin-top:auto;padding:40px 24px;border-top:1px solid var(--border);text-align:center;font-size:13px;color:var(--fg-muted)}
.footer a{color:var(--fg-soft)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.cf{position:absolute;width:8px;height:8px;opacity:.9;animation:cfFall 2.5s ease-out forwards}
@keyframes cfFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:400px}
.toast{background:var(--bg-elev);border:1px solid var(--border-s);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.35);backdrop-filter:blur(20px);pointer-events:auto;animation:toastIn .4s var(--spring) both;font-size:14px;color:var(--fg);min-width:200px}
.toast.out{animation:toastOut .3s var(--ease) both}
.toast-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.toast.success .toast-icon{background:var(--success);color:#000}
.toast.error .toast-icon{background:var(--danger);color:#fff}
.toast.info .toast-icon{background:var(--info);color:#fff}
.toast.warning .toast-icon{background:var(--warning);color:#000}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(20px) scale(.95)}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1001;animation:fadeIn .2s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-backdrop.out{animation:fadeOut .2s var(--ease) both}
@keyframes fadeOut{to{opacity:0}}
.modal{background:var(--bg-elev);border:1px solid var(--border-s);border-radius:22px;padding:28px;max-width:420px;width:100%;text-align:center;animation:modalIn .3s var(--spring) both}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-icon{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:24px}
.modal-icon.danger{background:rgba(255,69,58,.15);color:var(--danger)}
.modal-icon.info{background:rgba(10,132,255,.15);color:var(--info)}
.modal h3{font-size:1.25rem;font-weight:700;margin-bottom:10px;color:var(--fg)}
.modal p{color:var(--fg-soft);font-size:14.5px;line-height:1.55;margin-bottom:24px}
.modal-actions{display:flex;gap:10px;justify-content:center}
.modal-actions .btn{flex:1;justify-content:center}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;border-bottom:1px solid var(--border)}

.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:24px}

const LESSONS={
'level-1/01-apa-itu-ai':{id:`<h1>Apa Itu AI & LLM?</h1><p>Sebelum bisa menyuruh AI, kamu harus kenalan dulu.</p><h2>Kenalan Singkat</h2><p><strong>AI</strong> itu payung besar. Di dalamnya ada <strong>LLM (Large Language Model)</strong> — ChatGPT, Claude, Gemini.</p><p>LLM ibarat <em>kamu</em> yang udah baca hampir seluruh internet, tapi <strong>lupa segalanya setelah percakapan selesai</strong>.</p><h2>Kenapa Penting?</h2><p>Satu-satunya cara ngobrol sama LLM adalah lewat prompt. Gak ada tombol ajaib.</p><h3>1. AI Pemrediksi, Bukan Pencari Fakta</h3><p>LLM <strong>memprediksi kata berikutnya</strong>. Bisa <strong>salah dengan percaya diri</strong> — disebut halusinasi.</p><blockquote>⚠️ Selalu verifikasi fakta penting.</blockquote><h3>2. Konteks Adalah Segalanya</h3><p>AI gak tau kamu siapa. <strong>Kecuali kamu kasih tau.</strong></p><h3>3. AI Butuh Struktur</h3><p>Prompt berantakan = hasil berantakan.</p><h2>Coba Sendiri</h2><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Kamu adalah penjelas yang sabar. Jelaskan "Large Language Model" ke anak SMA dalam 2 paragraf, pakai analogi mudah. Hindari jargon.</div></div><h2>Poin Kunci</h2><ul><li>🧠 AI = pemrediksi teks</li><li>🔄 Setiap percakapan baru = mulai dari nol</li><li>📝 Prompt = satu-satunya cara</li><li>⚠️ Verifikasi fakta penting</li></ul>`,en:`<h1>What Are AI & LLMs?</h1><p>Before you can tell AI anything, meet it first.</p><h2>Quick Intro</h2><p><strong>AI</strong> is an umbrella. Inside: <strong>LLM (Large Language Model)</strong> — ChatGPT, Claude, Gemini.</p><p>An LLM is like <em>you</em> having read most of the internet, but <strong>forgetting everything when the conversation ends</strong>.</p><h2>Why It Matters</h2><p>The only way to talk to LLMs is via prompts. No magic button.</p><h3>1. AI Is a Predictor</h3><p>LLMs <strong>predict the next word</strong>. Can be <strong>confidently wrong</strong> — called hallucination.</p><blockquote>⚠️ Always verify important facts.</blockquote><h3>2. Context Is Everything</h3><p>AI doesn't know who you are. <strong>Unless you tell it.</strong></p><h3>3. AI Needs Structure</h3><p>Messy prompt = messy output.</p><h2>Try It Yourself</h2><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">You are a patient explainer. Explain "Large Language Model" to a high schooler in 2 paragraphs with easy analogy. Avoid jargon.</div></div><h2>Key Points</h2><ul><li>🧠 AI = text predictor</li><li>🔄 Every new conversation = from zero</li><li>📝 Prompt = your only way</li><li>⚠️ Verify important facts</li></ul>`},
'level-1/02-anatomi-prompt':{id:`<h1>Anatomi Prompt</h1><p>Prompt bagus punya struktur.</p><h2>5 Komponen Inti</h2><h3>1. Role</h3><pre><code>Kamu adalah chef profesional dengan 20 tahun pengalaman.</code></pre><h3>2. Task</h3><p>❌ "Bikin sesuatu tentang kopi"<br>✅ "Tulis 3 caption Instagram tentang kopi arabika"</p><h3>3. Context</h3><pre><code>Target: anak muda 18-25 tahun. Tone: santai.</code></pre><h3>4. Format</h3><pre><code>3 caption, max 150 karakter, diakhiri 5 hashtag.</code></pre><h3>5. Examples</h3><pre><code>"Kopi bukan minuman. Kopi adalah alasan bangun pagi."</code></pre><h2>Template Universal</h2><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Template</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body"># ROLE
Kamu adalah [profesi].

# TASK
[aksi spesifik]

# CONTEXT
Target: [siapa]
Nada: [formal/santai]

# FORMAT
- [poin 1]
- [poin 2]

# OUTPUT
Langsung hasilnya.</div></div><h2>Poin Kunci</h2><ul><li>5 komponen: Role, Task, Context, Format, Examples</li><li>Semakin spesifik = semakin bagus</li><li>Template bisa dipakai berkali-kali</li></ul>`,en:`<h1>Anatomy of a Prompt</h1><p>Good prompts have structure.</p><h2>5 Core Components</h2><h3>1. Role</h3><pre><code>You are a professional chef with 20 years experience.</code></pre><h3>2. Task</h3><p>❌ "Make something about coffee"<br>✅ "Write 3 Instagram captions about arabica coffee"</p><h3>3. Context</h3><pre><code>Target: 18-25 year olds. Tone: casual.</code></pre><h3>4. Format</h3><pre><code>3 captions, max 150 chars, ending with 5 hashtags.</code></pre><h3>5. Examples</h3><h2>Universal Template</h2><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Template</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body"># ROLE
You are a [profession].

# TASK
[specific action]

# CONTEXT
Target: [who]
Tone: [formal/casual]

# FORMAT
- [point 1]
- [point 2]

# OUTPUT
Give the result directly.</div></div><h2>Key Points</h2><ul><li>5 components: Role, Task, Context, Format, Examples</li><li>More specific = better</li></ul>`},
'level-1/03-prompt-pertamamu':{id:`<h1>Prompt Pertamamu</h1><p>Praktik dari nol.</p><h2>Mulai Sederhana</h2><p><strong>Percobaan 1 (jelek):</strong></p><pre><code>bikin caption kopi</code></pre><p><strong>Percobaan 2 (tambah task):</strong></p><pre><code>bikin 3 caption instagram tentang kopi arabika</code></pre><p><strong>Percobaan 3 (tambah role):</strong></p><pre><code>Kamu adalah copywriter jago bikin caption viral.</code></pre><p><strong>Percobaan 4 (tambah konteks):</strong></p><pre><code>Produk: kopi arabika Toraja.
Target: anak muda 20-30 tahun.
Brand tone: santai, sedikit humor.</code></pre><p><strong>Percobaan 5 (tambah format):</strong></p><pre><code>- Max 120 karakter
- 5 hashtag
- Hindari "kekinian", "hits"</code></pre><h2>Prompt Final</h2><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body"># ROLE
Kamu adalah copywriter jago caption Instagram viral.

# TASK
Bikin 3 caption Instagram untuk kopi arabika Toraja.

# CONTEXT
Target: anak muda 20-30 tahun.
Brand tone: santai, sedikit humor.

# FORMAT
- Max 120 karakter per caption
- 5 hashtag relevan

# CONSTRAINTS
- Hindari "kekinian", "hits", "viral"

# OUTPUT
Langsung 3 caption.</div></div><h2>Poin Kunci</h2><ul><li>Prompt dibangun <strong>bertahap</strong></li><li>Tambah komponen satu-satu</li><li>Iterasi itu normal</li></ul>`,en:`<h1>Your First Prompt</h1><p>Practice from scratch.</p><h2>Start Simple</h2><p><strong>Attempt 1 (bad):</strong></p><pre><code>write a caption about coffee</code></pre><p><strong>Attempt 2 (add task):</strong></p><pre><code>write 3 instagram captions about arabica coffee</code></pre><h2>Final Prompt</h2><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body"># ROLE
You are a copywriter great at viral Instagram captions.

# TASK
Write 3 Instagram captions for Toraja arabica coffee.

# CONTEXT
Target: 20-30 year olds.
Brand tone: casual, slight humor.

# FORMAT
- Max 120 chars per caption
- 5 relevant hashtags

# CONSTRAINTS
- Avoid "trendy", "hits", "viral"

# OUTPUT
Just the 3 captions.</div></div><h2>Key Points</h2><ul><li>Built <strong>incrementally</strong></li><li>Iteration is normal</li></ul>`},
'level-1/04-kesalahan-pemula':{id:`<h1>Kesalahan Umum Pemula</h1><p>Kamu pasti bakal ngelakuin minimal 5 dari 7 ini.</p><h2>1. Terlalu Vague</h2><p>❌ "Bikin konten bagus"<br>✅ "Bikin 5 ide TikTok tentang produktivitas untuk mahasiswa"</p><h2>2. Gak Kasih Konteks</h2><p>AI gak tau kamu siapa, kerja di mana, target audiens siapa.</p><h2>3. Numpuk Task</h2><p>❌ "Bikin artikel, ringkas, translate, bikin caption"</p><p><strong>Obat:</strong> pecah jadi beberapa prompt.</p><h2>4. Gak Kasih Format</h2><p>Kalau gak diminta, AI pilih sendiri — biasanya tembok teks.</p><h2>5. Gak Kasih Contoh</h2><p>"Profesional", "santai" itu subjektif. Kasih contoh.</p><h2>6. Gak Iterasi</h2><p>Prompt pertama = draft. Kedua = lebih baik.</p><h2>7. Percaya Mentah-mentah</h2><p>AI bisa salah. Verifikasi fakta penting.</p><h2>Poin Kunci</h2><ul><li>Spesifik > vague</li><li>Konteks > asumsi</li><li>Satu task per prompt</li><li>Format jelas > nebak</li><li>Contoh > abstrak</li><li>Iterasi > sekali jadi</li><li>Verifikasi > percaya buta</li></ul>`,en:`<h1>Common Beginner Mistakes</h1><p>You'll make at least 5 of these 7.</p><h2>1. Too Vague</h2><p>❌ "Make good content"<br>✅ "Give 5 TikTok ideas about productivity for students"</p><h2>2. No Context</h2><p>AI doesn't know who you are, where you work, who your audience is.</p><h2>3. Stacking Tasks</h2><p>Split into separate prompts.</p><h2>4. No Output Format</h2><p>Without format, AI picks its own — usually a wall of text.</p><h2>5. No Examples</h2><p>"Professional", "casual" are subjective. Give examples.</p><h2>6. No Iteration</h2><p>First prompt = draft. Second = better.</p><h2>7. Blind Trust</h2><p>AI can be wrong. Verify facts.</p><h2>Key Points</h2><ul><li>Specific > vague</li><li>Context > assumption</li><li>One task per prompt</li><li>Clear format > guessed</li><li>Examples > abstractions</li><li>Iterate > one-shot</li><li>Verify > blind trust</li></ul>`},
'level-2/01-zero-one-few-shot':{id:`<h1>Zero, One, Few-Shot</h1><p>Konsep fundamental. Tiga level kesulitan.</p><h2>Zero-Shot</h2><p>Gak kasih contoh.</p><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Zero-shot</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Klasifikasikan review ini sebagai positif, negatif, atau netral:
"Produk oke sih, tapi pengiriman lambat banget."</div></div><h2>One-Shot</h2><p>Kasih 1 contoh.</p><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">One-shot</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Contoh:
Input: "Barang bagus, cepat sampai!"
Output: POSITIF

Klasifikasikan:
Input: "Produk oke sih, tapi lambat."</div></div><h2>Few-Shot</h2><p>Kasih 3-5 contoh. Paling powerful.</p><div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Few-shot</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Contoh 1: "Barang bagus!" → POSITIF
Contoh 2: "Kecewa, rusak." → NEGATIF
Contoh 3: "Sampai, belum dipakai." → NETRAL

Klasifikasikan:
"Produk oke sih, tapi lambat."</div></div><h2>Poin Kunci</h2><ul><li>Zero-shot = default, cepat</li><li>Few-shot = konsisten, akurat</li><li>Kualitas contoh > jumlah</li><li>Contoh harus beragam & benar</li></ul>`,en:`<h1>Zero, One, Few-Shot</h1><p>Fundamental concept. Three difficulty levels.</p><h2>Zero-Shot</h2><p>No examples.</p><h2>One-Shot</h2><p>1 example.</p><h2>Few-Shot</h2><p>3-5 examples. Most powerful.</p><h2>Key Points</h2><ul><li>Zero-shot = default, fast</li><li>Few-shot = consistent, accurate</li><li>Quality > quantity</li></ul>`}

'level-1/05-berpikir-seperti-ai':{
id:`<h1>Berpikir Seperti AI</h1>
<p>Sekarang kamu udah tau AI itu gimana. Saatnya belajar berpikir dari sisi dia — biar prompt kamu makin jitu.</p>
<h2>Kenapa Ini Penting?</h2>
<p>Kalau kamu ngerti cara AI "mikir", kamu bisa antisipasi kesalahannya, dan desain prompt yang <strong>menghindari</strong> kesalahan itu.</p>
<p>Analogi: kalau kamu tau cara kerja mesin mobil, kamu bisa nyetir lebih halus dan hemat bensin.</p>
<h2>1. AI Itu Mesin Prediksi</h2>
<p>Setiap kali AI baca prompt kamu, dia gak "mikir" kayak manusia. Dia <strong>memprediksi kata berikutnya</strong> berdasarkan:</p>
<ul><li>Kata-kata di prompt kamu</li><li>Pola dari miliaran teks yang pernah dia lihat</li><li>Probabilitas statistik</li></ul>
<p>Artinya: kalau prompt kamu ambigu, AI pilih tafsiran yang <strong>paling sering muncul di data training</strong> — belum tentu yang kamu maksud.</p>
<h3>Contoh</h3>
<p>Prompt: <code>"Bikin caption kopi"</code></p>
<p>AI mikir: "Caption kopi biasanya kayak gimana di internet? Oh, biasanya ada kata 'nikmat', 'aroma', 'pagi'. Oke, aku bikin kayak gitu."</p>
<p>Kalau kamu mau gaya <strong>beda</strong> (misal minimalis Jepang), kamu harus bilang eksplisit.</p>
<h2>2. AI Gak Punya "Rasa"</h2>
<p>AI gak tau mana yang bagus dan mana yang jelek. Dia cuma tau mana yang <strong>statistiknya cocok</strong> sama prompt kamu.</p>
<p>Makanya:</p>
<ul><li>"Bagus" harus kamu definisikan (bagus menurut siapa? kriteria apa?)</li><li>"Menarik" harus kamu contohkan</li><li>"Sesuai brand" harus kamu jelasin brand-nya kayak apa</li></ul>
<h2>3. AI Konsisten di Pola, Bukan di Fakta</h2>
<p>Kalau kamu kasih 3 contoh dengan format sama, AI bakal ngikutin format itu <strong>dengan sangat konsisten</strong>.</p>
<p>Tapi kalau kamu tanya fakta, AI bisa ngasih jawaban beda tiap kali — karena dia <strong>gak "tau"</strong>, dia cuma "nebak" berdasarkan probabilitas.</p>
<p><strong>Pelajaran:</strong> buat format pakai contoh, buat fakta pakai verifikasi.</p>
<h2>4. AI Gampang "Ke-distract"</h2>
<p>Kalau prompt kamu kepanjangan dan isinya campur aduk, AI bisa fokus ke hal yang <strong>keliru</strong>.</p>
<h3>Contoh jelek:</h3>
<pre><code>Bikin artikel tentang kopi. Oh iya, kemarin aku ke Bali dan
lihat pura. Bali itu indah ya. Pokoknya bikin artikel
yang bagus, jangan lupa SEO, terus share ke sosmed juga.</code></pre>
<p>AI bingung: ini mau artikel kopi, cerita Bali, atau tutorial SEO?</p>
<h3>Contoh bagus:</h3>
<pre><code>TASK: Bikin artikel 500 kata tentang kopi arabika.
FORMAT: 3 subjudul, diakhiri tips menyeduh.
AUDIENS: Penikmat kopi pemula.
OUTPUT: Langsung artikelnya.</code></pre>
<h2>5. AI "Lupa" Konteks Kalau Kepanjangan</h2>
<p>Setiap model punya <strong>context window</strong> — batas maksimal teks yang bisa dia inget sekaligus. Kalau percakapan kepanjangan, bagian awal bisa "kepotong".</p>
<p><strong>Solusi:</strong> kalau percakapan udah panjang, ringkas ulang konteks penting di prompt baru.</p>
<h2>Coba Sendiri</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Aku mau ngasih kamu tugas. Sebelum ngerjain, jelasin dulu:
1. Apa yang kamu pahami dari instruksiku?
2. Apa yang ambigu atau kurang jelas?
3. Info apa lagi yang kamu butuhin?

Baru setelah aku konfirmasi, kamu kerjain tugasnya.

Tugas: Bikin 5 ide konten Instagram tentang produktivitas.</div></div>
<p>Ini teknik <strong>"reverse prompt"</strong> — kamu minta AI mikir dulu sebelum ngerjain. Hasilnya biasanya lebih bagus.</p>
<h2>Poin Kunci</h2>
<ul><li>🧠 AI = mesin prediksi, bukan pemikir</li><li>📊 "Bagus" harus kamu definisikan, bukan AI</li><li>🎯 Format dari contoh, fakta dari verifikasi</li><li>🚫 Jangan campur banyak topik dalam 1 prompt</li><li>📏 Context window ada batasnya</li></ul>
<h2>Selanjutnya</h2>
<p>Kamu udah lulus Level 1! Selamat 🎉 Lanjut ke Level 2: <strong>Zero, One, Few-Shot</strong>.</p>`,
en:`<h1>Thinking Like an AI</h1>
<p>You know what AI is now. Time to think from its side — so your prompts hit harder.</p>
<h2>Why This Matters</h2>
<p>If you understand how AI "thinks", you can anticipate its mistakes and design prompts that <strong>avoid</strong> them.</p>
<p>Analogy: if you know how a car engine works, you drive smoother and use less fuel.</p>
<h2>1. AI Is a Prediction Machine</h2>
<p>Every time AI reads your prompt, it doesn't "think" like a human. It <strong>predicts the next word</strong> based on:</p>
<ul><li>Words in your prompt</li><li>Patterns from billions of texts it has seen</li><li>Statistical probability</li></ul>
<p>Meaning: if your prompt is ambiguous, AI picks the interpretation <strong>most common in training data</strong> — not necessarily what you meant.</p>
<h3>Example</h3>
<p>Prompt: <code>"Write a coffee caption"</code></p>
<p>AI thinks: "What do coffee captions usually look like online? Oh, usually words like 'delicious', 'aroma', 'morning'. Okay, I'll write that."</p>
<p>If you want a <strong>different</strong> style (say, minimalist Japanese), you must say it explicitly.</p>
<h2>2. AI Has No "Taste"</h2>
<p>AI doesn't know what's good or bad. It only knows what <strong>statistically fits</strong> your prompt.</p>
<p>So:</p>
<ul><li>"Good" must be defined (good according to whom? what criteria?)</li><li>"Engaging" must be exemplified</li><li>"On-brand" must be explained</li></ul>
<h2>3. AI Is Consistent with Patterns, Not Facts</h2>
<p>If you give 3 examples with the same format, AI will follow that format <strong>very consistently</strong>.</p>
<p>But if you ask about facts, AI may answer differently each time — because it <strong>doesn't "know"</strong>, it just "guesses" based on probability.</p>
<p><strong>Lesson:</strong> use examples for format, use verification for facts.</p>
<h2>4. AI Gets Easily "Distracted"</h2>
<p>If your prompt is too long and mixed, AI may focus on the <strong>wrong thing</strong>.</p>
<h3>Bad example:</h3>
<pre><code>Write an article about coffee. Oh yeah, yesterday I went to
Bali and saw a temple. Bali is beautiful. Anyway write a
good article, don't forget SEO, then share it to social too.</code></pre>
<p>AI is confused: article about coffee, Bali story, or SEO tutorial?</p>
<h3>Good example:</h3>
<pre><code>TASK: Write a 500-word article about arabica coffee.
FORMAT: 3 subheadings, end with brewing tips.
AUDIENCE: Beginner coffee enthusiasts.
OUTPUT: Just the article.</code></pre>
<h2>5. AI "Forgets" When It's Too Long</h2>
<p>Every model has a <strong>context window</strong> — a max limit of text it can hold at once. If a conversation gets too long, the beginning may get "cut off".</p>
<p><strong>Fix:</strong> in long conversations, restate key context in a new prompt.</p>
<h2>Try It Yourself</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">I'm giving you a task. Before doing it, explain first:
1. What did you understand from my instructions?
2. What's ambiguous or unclear?
3. What additional info do you need?

Only after I confirm, do the task.

Task: Give me 5 Instagram content ideas about productivity.</div></div>
<p>This is the <strong>"reverse prompt"</strong> technique — ask AI to think before acting. Usually the result is better.</p>
<h2>Key Points</h2>
<ul><li>🧠 AI = prediction machine, not a thinker</li><li>📊 "Good" must be defined by you, not AI</li><li>🎯 Format from examples, facts from verification</li><li>🚫 Don't mix too many topics in one prompt</li><li>📏 Context window has limits</li></ul>
<h2>Next</h2>
<p>You've passed Level 1! Congrats 🎉 On to Level 2: <strong>Zero, One, Few-Shot</strong>.</p>`
},
'level-2/02-chain-of-thought':{
id:`<h1>Chain of Thought</h1>
<p>Ini teknik paling ampuh buat task yang butuh penalaran. Simpel banget — cuma nambahin satu kalimat ajaib.</p>
<h2>Idenya</h2>
<p>Kalau kamu tanya AI hal yang butuh mikir bertahap, dan kamu minta jawaban langsung — AI sering salah.</p>
<p>Kalau kamu minta AI <strong>mikir dulu, step by step</strong> — akurasi naik drastis.</p>
<p>Kenapa? Karena AI itu mesin prediksi kata. Kalau dia nulis langkah-langkah penalaran, kata berikutnya <strong>dikondisikan</strong> oleh langkah sebelumnya. Jadi hasilnya lebih logis.</p>
<h2>Contoh Sederhana</h2>
<h3>Tanpa CoT</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Toko A punya 3 kardus apel. Tiap kardus isi 20 apel. 4 apel busuk dibuang. Sisanya dibagi rata ke 4 keranjang. Berapa apel per keranjang?</div></div>
<p>Tanpa CoT: AI kadang jawab 14, 15, atau 16 (ambigu).</p>
<p><strong>Dengan CoT:</strong></p>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt dengan CoT</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Toko A punya 3 kardus apel. Tiap kardus isi 20 apel. 4 apel busuk dibuang. Sisanya dibagi rata ke 4 keranjang. Berapa apel per keranjang?

Pikirkan langkah demi langkah sebelum menjawab.</div></div>
<p>AI bakal nulis:</p>
<pre><code>Langkah 1: Total apel awal = 3 × 20 = 60
Langkah 2: Buang 4 apel busuk = 60 - 4 = 56
Langkah 3: Bagi ke 4 keranjang = 56 / 4 = 14

Jawaban: 14 apel per keranjang.</code></pre>
<p>Akurat, konsisten, bisa diverifikasi.</p>
<h2>Magic Phrase</h2>
<p>Cukup tambahkan salah satu kalimat ini di akhir prompt:</p>
<ul><li>🇮🇩 "Pikirkan langkah demi langkah sebelum menjawab."</li><li>🇮🇩 "Tunjukkan proses berpikirmu."</li><li>🇮🇩 "Jelaskan reasoning-mu dulu, baru kasih jawaban."</li><li>🇬🇧 "Think step by step."</li><li>🇬🇧 "Show your reasoning before answering."</li><li>🇬🇧 "Explain your thinking first, then answer."</li></ul>
<h2>Kapan Pakai CoT?</h2>
<p>✅ <strong>Cocok untuk:</strong></p>
<ul><li>Matematika & logika</li><li>Analisis & debugging</li><li>Keputusan multi-kriteria</li><li>Perencanaan (planning)</li><li>Perbandingan kompleks</li></ul>
<p>❌ <strong>Gak cocok untuk:</strong></p>
<ul><li>Terjemahan (bikin aneh)</li><li>Ringkasan singkat</li><li>Task kreatif murni (kadang malah kaku)</li></ul>
<h2>Varian: Few-Shot CoT</h2>
<p>Kasih 1-2 contoh penalaran lengkap, lalu minta AI ngerjain task serupa.</p>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Few-shot CoT</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Contoh:
Q: Rina punya 5 buku. Dia beli 3 lagi, lalu kasih 2 ke adiknya. Berapa buku Rina?
A: Rina mulai dengan 5. Beli 3 = 5 + 3 = 8. Kasih 2 = 8 - 2 = 6. Jawaban: 6.

Q: Budi punya 12 kelereng. 1/3 hilang, lalu dia beli 5 lagi. Berapa kelereng Budi?
A: [lanjutkan]</div></div>
<h2>Referensi</h2>
<ul><li><a href="https://arxiv.org/abs/2201.11903" target="_blank" rel="noopener">Chain-of-Thought Prompting Elicits Reasoning in LLMs (Wei et al., 2022)</a></li><li><a href="https://www.promptingguide.ai/techniques/cot" target="_blank" rel="noopener">Prompt Engineering Guide — Chain of Thought</a></li></ul>
<h2>Poin Kunci</h2>
<ul><li>Cukup tambah "think step by step" → akurasi naik drastis</li><li>Cocok untuk task penalaran, gak cocok untuk kreatif murni</li><li>Bisa dikombinasi dengan few-shot untuk hasil maksimal</li></ul>
<h2>Selanjutnya</h2>
<p>Kita bahas <strong>Role Prompting</strong> — cara assign persona ke AI.</p>`,
en:`<h1>Chain of Thought</h1>
<p>The most powerful technique for reasoning tasks. Super simple — just one magic sentence.</p>
<h2>The Idea</h2>
<p>If you ask AI something that requires multi-step thinking and demand an immediate answer — AI often gets it wrong.</p>
<p>If you ask AI to <strong>think step by step first</strong> — accuracy jumps dramatically.</p>
<p>Why? Because AI is a word predictor. If it writes reasoning steps, the next words are <strong>conditioned</strong> on prior steps. So the output becomes more logical.</p>
<h2>Simple Example</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Without CoT</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Store A has 3 boxes of apples. Each box has 20 apples. 4 apples are rotten and thrown out. The rest is split evenly into 4 baskets. How many apples per basket?</div></div>
<p><strong>With CoT:</strong></p>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">With CoT</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Store A has 3 boxes of apples. Each box has 20 apples. 4 apples are rotten and thrown out. The rest is split evenly into 4 baskets. How many apples per basket?

Think step by step before answering.</div></div>
<p>AI writes:</p>
<pre><code>Step 1: Total apples at start = 3 × 20 = 60
Step 2: Discard 4 rotten = 60 - 4 = 56
Step 3: Split into 4 baskets = 56 / 4 = 14

Answer: 14 apples per basket.</code></pre>
<h2>Magic Phrases</h2>
<ul><li>"Think step by step."</li><li>"Show your reasoning."</li><li>"Explain your thinking first, then answer."</li></ul>
<h2>When to Use CoT?</h2>
<p>✅ <strong>Great for:</strong> math, logic, analysis, debugging, planning, complex comparisons.</p>
<p>❌ <strong>Bad for:</strong> translation, short summaries, pure creative tasks.</p>
<h2>Few-Shot CoT</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Few-shot CoT</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Example:
Q: Rina has 5 books. She buys 3 more, then gives 2 to her sister. How many books does Rina have?
A: Rina starts with 5. Buys 3 = 5 + 3 = 8. Gives 2 = 8 - 2 = 6. Answer: 6.

Q: Budi has 12 marbles. 1/3 are lost, then he buys 5 more. How many marbles does Budi have?
A: [continue]</div></div>
<h2>References</h2>
<ul><li><a href="https://arxiv.org/abs/2201.11903" target="_blank" rel="noopener">Chain-of-Thought Prompting (Wei et al., 2022)</a></li><li><a href="https://www.promptingguide.ai/techniques/cot" target="_blank" rel="noopener">Prompt Engineering Guide — CoT</a></li></ul>
<h2>Key Points</h2>
<ul><li>Just add "think step by step" → accuracy jumps</li><li>Great for reasoning, bad for pure creative</li><li>Can combine with few-shot for max results</li></ul>
<h2>Next</h2>
<p>We cover <strong>Role Prompting</strong>.</p>`
},
'level-2/03-role-prompting':{
id:`<h1>Role Prompting</h1>
<p>Salah satu teknik paling gampang yang efeknya paling besar. Cuma nambahin satu kalimat di awal prompt.</p>
<h2>Idenya</h2>
<p>Kalau kamu kasih AI <strong>persona</strong> tertentu, dia bakal ngikutin gaya, kosakata, dan cara berpikir persona itu.</p>
<h3>Tanpa role</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Jelaskan apa itu inflasi.</div></div>
<p>Hasil: penjelasan umum, kadang terlalu formal, kadang terlalu teknis.</p>
<h3>Dengan role</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Kamu adalah guru ekonomi SMA yang sabar dan suka pakai analogi sehari-hari.

Jelaskan apa itu inflasi ke siswa kelas 11.</div></div>
<p>Hasil: lebih ramah, ada analogi, kosakata disesuaikan.</p>
<h2>Kenapa Bekerja?</h2>
<p>Karena AI "memprediksi kata berdasarkan pola". Kalau kamu bilang "Kamu adalah chef profesional", dia mengaktifkan <strong>pola teks yang biasa ditulis oleh/di sekitar chef</strong> — kosakata, ritme, referensi.</p>
<h2>3 Level Role Prompting</h2>
<h3>Level 1 — Role sederhana</h3>
<pre><code>Kamu adalah copywriter.</code></pre>
<h3>Level 2 — Role + karakteristik</h3>
<pre><code>Kamu adalah copywriter dengan 10 tahun pengalaman di
brand fashion premium. Gaya tulisanmu minimalis,
hindari kata hiperbola.</code></pre>
<h3>Level 3 — Role + karakteristik + cara berpikir</h3>
<pre><code>Kamu adalah copywriter dengan 10 tahun pengalaman di
brand fashion premium.

Sebelum menulis, kamu selalu:
1. Tanya siapa target audiensnya
2. Tanya tone brand-nya
3. Baru tulis copy

Kamu percaya: copy bagus itu bikin orang ngerasa
"ini gue banget", bukan "wah keren".</code></pre>
<h2>Role yang Sering Berguna</h2>
<table>
<tr><th>Butuh</th><th>Role</th></tr>
<tr><td>Editing tulisan</td><td>"Editor profesional 10 tahun pengalaman"</td></tr>
<tr><td>Debugging</td><td>"Senior engineer sabar & metodis"</td></tr>
<tr><td>Nasihat bisnis</td><td>"Business consultant fokus praktik, bukan teori"</td></tr>
<tr><td>Konten sosmed</td><td>"Social media strategist paham algoritma"</td></tr>
<tr><td>Belajar konsep</td><td>"Guru sabar yang suka pakai analogi"</td></tr>
<tr><td>Data analysis</td><td>"Data analyst skeptis yang selalu verifikasi"</td></tr>
</table>
<h2>Tips Role Prompting</h2>
<ol>
<li><strong>Spesifik > umum</strong>: "chef" < "chef pastry Perancis" < "chef pastry spesialis croissant"</li>
<li><strong>Jangan role yang bentrok</strong>: "guru sabar sekaligus kritikus galak" → bingung</li>
<li><strong>Kombinasi dengan teknik lain</strong>: role + CoT + few-shot = powerful</li>
<li><strong>Role + anti-role</strong>: "Kamu adalah X. Jangan jadi Y."</li>
</ol>
<h2>Contoh Kombinasi</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Role + CoT + Few-Shot</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Kamu adalah senior product manager di startup SaaS dengan 8 tahun pengalaman. Keputusanmu berbasis data, bukan feeling.

TASK: Evaluasi fitur baru berdasarkan data yang aku kasih.

CARA BERPIKIR:
1. Apa masalah yang fitur ini selesaikan?
2. Siapa target user-nya?
3. Apa metrik keberhasilannya?
4. Apa risiko terbesarnya?

Contoh output:
"Fitur X menyelesaikan masalah Y untuk user Z. Metrik: A, B, C. Risiko utama: D karena E."

Sekarang evaluasi:
[data kamu]</div></div>
<h2>Poin Kunci</h2>
<ul><li>Role = nyalain "pola" tertentu di AI</li><li>Semakin spesifik role, semakin konsisten gaya</li><li>Kombinasi role + CoT + few-shot = paling kuat</li><li>Jangan role yang saling bertentangan</li></ul>
<h2>Selanjutnya</h2>
<p>Kita bahas <strong>Format Output</strong> — cara minta hasil dalam struktur spesifik.</p>`,
en:`<h1>Role Prompting</h1>
<p>One of the easiest techniques with the biggest impact. Just one sentence at the start.</p>
<h2>The Idea</h2>
<p>Assign AI a specific <strong>persona</strong> and it follows that persona's style, vocabulary, and thinking.</p>
<h2>Why It Works</h2>
<p>Because AI "predicts words based on patterns." Saying "You are a professional chef" activates <strong>text patterns usually written by/about chefs</strong>.</p>
<h2>3 Levels of Role Prompting</h2>
<h3>Level 1 — Simple role</h3>
<pre><code>You are a copywriter.</code></pre>
<h3>Level 2 — Role + characteristics</h3>
<pre><code>You are a copywriter with 10 years experience in
premium fashion brands. Your writing is minimalist.</code></pre>
<h3>Level 3 — Role + characteristics + thinking process</h3>
<pre><code>You are a copywriter with 10 years in premium fashion.

Before writing, you always:
1. Ask who the target audience is
2. Ask the brand tone
3. Then write

You believe: good copy makes people feel "this is me".</code></pre>
<h2>Useful Roles</h2>
<table>
<tr><th>Need</th><th>Role</th></tr>
<tr><td>Editing</td><td>"Professional editor, 10 years experience"</td></tr>
<tr><td>Debugging</td><td>"Patient, methodical senior engineer"</td></tr>
<tr><td>Business advice</td><td>"Business consultant focused on practice"</td></tr>
<tr><td>Social content</td><td>"Social media strategist who knows algorithms"</td></tr>
<tr><td>Learning concepts</td><td>"Patient teacher who loves analogies"</td></tr>
<tr><td>Data analysis</td><td>"Skeptical analyst who always verifies"</td></tr>
</table>
<h2>Role Prompting Tips</h2>
<ol>
<li><strong>Specific > general</strong></li>
<li><strong>Don't conflict roles</strong></li>
<li><strong>Combine with others</strong>: role + CoT + few-shot = powerful</li>
<li><strong>Role + anti-role</strong>: "You are X. Don't be Y."</li>
</ol>
<h2>Combined Example</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Role + CoT + Few-Shot</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">You are a senior product manager at a SaaS startup with 8 years of experience. You're known for data-driven decisions.

TASK: Evaluate our new feature based on the data.

THINKING PROCESS:
1. What problem does it solve?
2. Who's the target user?
3. What are the success metrics?
4. What's the biggest risk?

Example output:
"Feature X solves Y for user Z. Metrics: A, B, C. Main risk: D."

Now evaluate:
[your data]</div></div>
<h2>Key Points</h2>
<ul><li>Role = activate a specific "pattern" in AI</li><li>More specific role = more consistent style</li><li>Role + CoT + few-shot = strongest combo</li><li>Don't assign conflicting roles</li></ul>
<h2>Next</h2>
<p>We cover <strong>Output Formatting</strong>.</p>`
},
'level-2/04-format-output':{
id:`<h1>Format Output</h1>
<p>Kalau kamu gak minta format spesifik, AI bakal pilih sendiri — biasanya jadi tembok teks yang bikin mata sakit.</p>
<h2>Kenapa Format Penting?</h2>
<p><strong>1. Bikin hasil bisa langsung dipakai.</strong> Butuh data buat Excel? Minta CSV. Butuh konten blog? Minta markdown.</p>
<p><strong>2. Bikin hasil bisa diverifikasi.</strong> Format terstruktur = lebih gampang dicek.</p>
<p><strong>3. Bikin hasil konsisten.</strong> Kalau format ditentukan, output berikutnya bakal sama.</p>
<h2>Format Umum</h2>
<h3>1. Bullet List</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Kasih 5 ide konten Instagram tentang produktivitas.

Format:
- 1 baris per ide
- Diawali emoji
- Maksimal 10 kata per ide</div></div>
<h3>2. Tabel</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Bandingin 3 tools manajemen tugas: Todoist, Things, TickTick.

Format: tabel markdown dengan kolom:
Nama | Harga | Platform | Kelebihan | Kekurangan</div></div>
<h3>3. JSON</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Ekstrak info dari teks berikut.

Format JSON:
{
  "nama": "string",
  "email": "string",
  "perusahaan": "string"
}

Teks: "Halo, saya Budi dari PT Maju Jaya. Email saya budi@majujaya.com."</div></div>
<h3>4. Markdown</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Tulis artikel 500 kata tentang kopi.

Format markdown:
- H1 judul
- 3 H2 subjudul
- 1 blockquote di tengah
- Diakhiri bullet list "Tips"</div></div>
<h3>5. Numbered Steps</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Jelasin cara bikin kopi pour-over.

Format:
1. Langkah
2. Langkah
...
Setiap langkah: max 2 kalimat.</div></div>
<h2>Teknik Advanced</h2>
<h3>Format Bersyarat</h3>
<pre><code>Kalau jawabannya "ya", jelasin dalam 3 bullet.
Kalau "tidak", kasih 1 kalimat + 2 alternatif.</code></pre>
<h3>Format + Panjang</h3>
<pre><code>Setiap bullet maksimal 15 kata.
Total maksimal 100 kata.</code></pre>
<h3>Format Bertingkat</h3>
<pre><code>Format:
1. Ringkasan (1 paragraf)
   1a. Poin penting (3 bullet)
   1b. Rekomendasi (1 kalimat)
2. Detail teknis</code></pre>
<h2>Kesalahan Umum</h2>
<p>❌ "Bikin format yang bagus" → AI nebak</p>
<p>✅ "Format: bullet list, max 5 poin, tiap poin max 15 kata"</p>
<h2>Template Format Universal</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Template</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">FORMAT OUTPUT:
- Struktur: [bullet / tabel / JSON / markdown / numbered]
- Panjang: [maks X kata / Y poin]
- Tone: [formal / santai / ...]
- Wajib ada: [elemen X, Y]
- Hindari: [elemen Z]
- Contoh format:
  [kasih mini example]</div></div>
<h2>Poin Kunci</h2>
<ul><li>Selalu minta format spesifik untuk task produksi</li><li>Format = kontrak antara kamu dan AI</li><li>Semakin jelas format, semakin konsisten output</li><li>Gabungin format + panjang + tone</li></ul>
<h2>Selanjutnya</h2>
<p>Kita bahas <strong>Konteks adalah Raja</strong> — kenapa konteks adalah senjata paling ampuh.</p>`,
en:`<h1>Output Formatting</h1>
<p>If you don't specify format, AI picks its own — usually a wall of text.</p>
<h2>Why Format Matters</h2>
<p><strong>1. Makes output immediately usable.</strong> Need Excel data? Ask CSV. Need blog content? Ask markdown.</p>
<p><strong>2. Makes output verifiable.</strong> Structured = easier to check.</p>
<p><strong>3. Makes output consistent.</strong></p>
<h2>Common Formats</h2>
<h3>1. Bullet List</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Give me 5 Instagram content ideas about productivity.

Format:
- 1 line per idea
- Start with emoji
- Max 10 words per idea</div></div>
<h3>2. Table</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Compare 3 task management tools: Todoist, Things, TickTick.

Format: markdown table with columns:
Name | Price | Platform | Pros | Cons</div></div>
<h3>3. JSON</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Extract info from the following text.

Format JSON:
{
  "name": "string",
  "email": "string",
  "company": "string"
}

Text: "Hi, I'm Budi from PT Maju Jaya. My email is budi@majujaya.com."</div></div>
<h3>4. Markdown</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Write a 500-word article about coffee.

Markdown format:
- H1 title
- 3 H2 subheadings
- 1 blockquote in the middle
- End with a "Tips" bullet list</div></div>
<h3>5. Numbered Steps</h3>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Explain how to make pour-over coffee.

Format:
1. Step
2. Step
...
Each step: max 2 sentences.</div></div>
<h2>Advanced Techniques</h2>
<h3>Conditional Format</h3>
<pre><code>If the answer is "yes", explain in 3 bullets.
If "no", give 1 sentence + 2 alternatives.</code></pre>
<h3>Format + Length</h3>
<pre><code>Each bullet max 15 words.
Total max 100 words.</code></pre>
<h3>Nested Format</h3>
<pre><code>Format:
1. Summary (1 paragraph)
   1a. Key points (3 bullets)
   1b. Recommendation (1 sentence)
2. Technical details</code></pre>
<h2>Common Mistakes</h2>
<p>❌ "Make a good format" → AI guesses</p>
<p>✅ "Format: bullet list, max 5 points, each max 15 words"</p>
<h2>Universal Format Template</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Template</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">OUTPUT FORMAT:
- Structure: [bullet / table / JSON / markdown / numbered]
- Length: [max X words / Y points]
- Tone: [formal / casual / ...]
- Must include: [elements X, Y]
- Avoid: [element Z]
- Format example:
  [give a mini example]</div></div>
<h2>Key Points</h2>
<ul><li>Always specify format for production tasks</li><li>Format = a contract between you and AI</li><li>Clearer format = more consistent output</li><li>Combine format + length + tone</li></ul>
<h2>Next</h2>
<p>We cover <strong>Context Is King</strong>.</p>`
},
'level-2/05-konteks-adalah-raja':{
id:`<h1>Konteks adalah Raja</h1>
<p>Kalau cuma boleh pilih satu teknik prompting, aku pilih konteks. Karena konteks yang bagus bisa menyelamatkan prompt yang jelek. Tapi prompt bagus tanpa konteks tetap jelek.</p>
<h2>Apa Itu Konteks?</h2>
<p>Konteks = semua informasi yang bikin AI ngerti <strong>situasi</strong> kamu. Bukan cuma "apa yang kamu mau", tapi juga:</p>
<ul>
<li>Kamu siapa</li>
<li>Buat siapa</li>
<li>Untuk apa</li>
<li>Dalam situasi apa</li>
<li>Dengan batasan apa</li>
</ul>
<h2>7 Lapis Konteks</h2>
<h3>1. Konteks Diri</h3>
<pre><code>Aku freelancer desain grafis, 3 tahun pengalaman,
kebanyakan klien UMKM.</code></pre>
<h3>2. Konteks Audiens</h3>
<pre><code>Target: pemilik UMKM kuliner yang gaptek.</code></pre>
<h3>3. Konteks Tujuan</h3>
<pre><code>Tujuan: bikin mereka ngerti kenapa desain penting
tanpa bikin mereka ngerasa bodoh.</code></pre>
<h3>4. Konteks Situasi</h3>
<pre><code>Ini buat konten Instagram carousel 5 slide.</code></pre>
<h3>5. Konteks Format</h3>
<pre><code>Format: 5 slide, tiap slide 1 poin utama,
max 20 kata per slide.</code></pre>
<h3>6. Konteks Tone</h3>
<pre><code>Tone: santai, sedikit humor, hindari jargon desain.</code></pre>
<h3>7. Konteks Constraint</h3>
<pre><code>Hindari: kata "estetik", "vibes".
Wajib ada: contoh konkret dari UMKM.</code></pre>
<h2>Prompt Lengkap dengan 7 Lapis</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Kamu adalah desainer grafis yang jago ngomong ke orang non-desain.

KONTEKS DIRI:
Aku freelancer desain grafis, 3 tahun pengalaman,
kebanyakan klien UMKM.

AUDIENS:
Pemilik UMKM kuliner yang gaptek.

TUJUAN:
Bikin mereka ngerti kenapa desain penting tanpa
bikin mereka ngerasa bodoh.

SITUASI:
Konten Instagram carousel 5 slide.

FORMAT:
- 5 slide
- Tiap slide: 1 poin utama
- Max 20 kata per slide
- Slide 1: hook
- Slide 5: CTA

TONE:
Santai, sedikit humor, hindari jargon desain.

CONSTRAINTS:
Hindari: "estetik", "vibes", "aesthetic"
Wajib ada: contoh konkret dari UMKM

OUTPUT:
Langsung 5 slide. Format:
Slide 1: [teks]
Slide 2: [teks]
...</div></div>
<h2>Hierarki Konteks</h2>
<ol>
<li><strong>Audiens</strong> — siapa yang baca/lihat hasilnya</li>
<li><strong>Tujuan</strong> — hasilnya buat apa</li>
<li><strong>Format</strong> — bentuk output</li>
<li><strong>Tone</strong> — gaya bahasa</li>
<li><strong>Constraint</strong> — batasan</li>
<li><strong>Konteks diri</strong> — siapa kamu</li>
<li><strong>Situasi</strong> — kapan & di mana dipakai</li>
</ol>
<h2>Kesalahan Umum</h2>
<p>❌ <strong>Konteks gak relevan</strong></p>
<pre><code>Aku suka kopi. Bikin artikel tentang kopi.</code></pre>
<p>Kesukaanmu gak relevan.</p>
<p>❌ <strong>Over-context</strong></p>
<pre><code>Kemarin aku bangun jam 6, terus mandi, terus sarapan...</code></pre>
<p>AI gak butuh diary kamu.</p>
<p>❌ <strong>Konteks implisit</strong></p>
<pre><code>Bikin caption buat produk baru.</code></pre>
<p>Apa produknya? Buat siapa? Tone gimana?</p>
<h2>Teknik "Context Sandwich"</h2>
<p>Taruh konteks penting di awal dan di akhir prompt. Karena AI cenderung lebih "inget" bagian awal dan akhir.</p>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">[KONTEKS PENTING: target audiens = pemilik UMKM kuliner]

[TASK: bikin 5 ide konten Instagram]

[DETAIL: format, tone, constraints]

[ULANG KONTEKS: ingat, audiensnya pemilik UMKM kuliner yang gaptek]</div></div>
<h2>Coba Sendiri</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Sebelum ngerjain tugas, tanya aku:
1. Siapa target audiens?
2. Apa tujuannya?
3. Format apa yang aku mau?
4. Tone-nya gimana?
5. Ada batasan khusus?

Baru setelah aku jawab semua, kamu kerjain.

TUGAS: Bikin konten Instagram tentang produktivitas.</div></div>
<p>Ini <strong>"context-first"</strong> — paksa AI ngumpulin konteks dulu.</p>
<h2>Poin Kunci</h2>
<ul><li>Konteks > teknik lain. Ini fondasi.</li><li>7 lapis konteks: diri, audiens, tujuan, situasi, format, tone, constraint</li><li>Prioritaskan: audiens, tujuan, format</li><li>Jangan over-context atau konteks implisit</li><li>Taruh konteks penting di awal & akhir</li></ul>
<h2>Selanjutnya</h2>
<p>Level 2 hampir selesai! Yang terakhir: <strong>Iterasi Prompt</strong>.</p>`,
en:`<h1>Context Is King</h1>
<p>If you could only pick one prompting technique, I'd pick context. Good context can save a bad prompt. But a good prompt without context is still bad.</p>
<h2>What Is Context?</h2>
<p>Context = everything that makes AI understand your <strong>situation</strong>. Not just "what you want", but also:</p>
<ul>
<li>Who you are</li>
<li>Who it's for</li>
<li>What it's for</li>
<li>In what situation</li>
<li>With what constraints</li>
</ul>
<h2>7 Layers of Context</h2>
<h3>1. Self Context</h3>
<pre><code>I'm a freelance graphic designer, 3 years experience,
mostly SMB clients.</code></pre>
<h3>2. Audience Context</h3>
<pre><code>Target: culinary SMB owners who aren't tech-savvy.</code></pre>
<h3>3. Goal Context</h3>
<pre><code>Goal: help them understand why design matters,
without making them feel dumb.</code></pre>
<h3>4. Situation Context</h3>
<pre><code>This is for a 5-slide Instagram carousel.</code></pre>
<h3>5. Format Context</h3>
<pre><code>5 slides, each with 1 main point, max 20 words per slide.</code></pre>
<h3>6. Tone Context</h3>
<pre><code>Tone: casual, slight humor, no design jargon.</code></pre>
<h3>7. Constraint Context</h3>
<pre><code>Avoid: "aesthetic", "vibes".
Must include: concrete SMB examples.</code></pre>
<h2>Full Prompt with 7 Layers</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">You are a graphic designer great at talking to non-designers.

SELF CONTEXT:
I'm a freelance graphic designer, 3 years experience,
mostly SMB clients.

AUDIENCE:
Culinary SMB owners who aren't tech-savvy.

GOAL:
Help them understand why design matters without
making them feel dumb.

SITUATION:
5-slide Instagram carousel.

FORMAT:
- 5 slides
- Each slide: 1 main point
- Max 20 words per slide
- Slide 1: hook
- Slide 5: CTA

TONE:
Casual, slight humor, no design jargon.

CONSTRAINTS:
Avoid: "aesthetic", "vibes"
Must include: concrete SMB examples

OUTPUT:
Just the 5 slides. Format:
Slide 1: [text]
...</div></div>
<h2>Context Hierarchy</h2>
<ol>
<li><strong>Audience</strong></li>
<li><strong>Goal</strong></li>
<li><strong>Format</strong></li>
<li><strong>Tone</strong></li>
<li><strong>Constraints</strong></li>
<li><strong>Self context</strong></li>
<li><strong>Situation</strong></li>
</ol>
<h2>Common Mistakes</h2>
<p>❌ <strong>Irrelevant context</strong></p>
<p>❌ <strong>Over-context</strong> (your diary)</p>
<p>❌ <strong>Implicit context</strong> (missing key details)</p>
<h2>"Context Sandwich" Technique</h2>
<p>Put important context at the start AND end.</p>
<h2>Try It Yourself</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Before doing the task, ask me:
1. Who's the target audience?
2. What's the goal?
3. What format do I want?
4. What tone?
5. Any special constraints?

Only after I answer all, do the task.

TASK: Write Instagram content about productivity.</div></div>
<h2>Key Points</h2>
<ul><li>Context > other techniques. Foundation.</li><li>7 layers: self, audience, goal, situation, format, tone, constraint</li><li>Prioritize: audience, goal, format</li><li>Don't over-context or be implicit</li><li>Place important context at start & end</li></ul>
<h2>Next</h2>
<p>Level 2's last: <strong>Prompt Iteration</strong>.</p>`
},
'level-2/06-iterasi-prompt':{
id:`<h1>Iterasi Prompt</h1>
<p>Prompt pertama kamu hampir gak pernah jadi prompt terbaik. Yang bikin hasil bagus itu <strong>iterasi</strong> — perbaikan bertahap.</p>
<h2>Mindset</h2>
<p>Jangan anggap prompting sebagai "ketik sekali, dapat hasil sempurna". Anggap sebagai <strong>percakapan</strong> dengan AI.</p>
<p>Prompt pertama = draft.</p>
<p>Prompt kedua = revisi.</p>
<p>Prompt ketiga = biasanya udah bagus.</p>
<h2>Loop Iterasi 4 Langkah</h2>
<pre><code>1. TRY    → Tulis prompt, jalankan
2. CHECK  → Hasil udah sesuai? Belum? Bagian mana?
3. FIX    → Perbaiki 1 hal (jangan semua sekaligus)
4. REPEAT → Ulangi sampai cukup bagus</code></pre>
<h2>7 Teknik Iterasi</h2>
<h3>1. "More Like This, Less Like That"</h3>
<p>Setelah dapat hasil, bilang:</p>
<pre><code>Versi ini udah bagus di bagian X.
Tapi bagian Y terlalu [Z].

Ulangi dengan:
- Pertahankan bagian X
- Ubah bagian Y jadi [sesuatu]</code></pre>
<h3>2. Kasih Contoh Negatif</h3>
<pre><code>Ini contoh yang AKU GAK MAU:
[contoh jelek]

Ini contoh yang AKU MAU:
[contoh bagus]

Sekarang bikin versi baru yang mirip yang kedua.</code></pre>
<h3>3. Zoom In</h3>
<p>Kalau hasil secara keseluruhan oke tapi ada bagian yang jelek:</p>
<pre><code>Yang lain udah oke. Fokus ke paragraf 2 aja.

Paragraf 2 terlalu panjang. Pecah jadi 3
kalimat pendek, dan tambah 1 contoh konkret.</code></pre>
<h3>4. A/B Compare</h3>
<pre><code>Kasih aku 3 versi:
- Versi A: lebih formal
- Versi B: lebih santai
- Versi C: lebih pendek (max 100 kata)

Aku bakal pilih satu, terus kita polish.</code></pre>
<h3>5. Reverse Engineer</h3>
<p>Kadang lebih gampang mulai dari hasil, bukan dari prompt.</p>
<pre><code>Ini output yang aku mau: [contoh]

Tolong analisis: prompt kayak gimana yang
bakal ngasih output ini? Terus kasih aku
prompt-nya.</code></pre>
<h3>6. Feedback Loop</h3>
<pre><code>Nilai hasil kamu sendiri:
- Apa 3 kekuatan output ini?
- Apa 3 kelemahan?
- Kalau kamu bisa ngerjain ulang, apa
  yang bakal kamu ubah?

Sekarang perbaiki sesuai jawabanmu.</code></pre>
<h3>7. Constraint Cascade</h3>
<p>Tambah 1 constraint per iterasi:</p>
<pre><code>Iterasi 1: Bikin caption.
Iterasi 2: Bikin caption, max 100 kata.
Iterasi 3: Bikin caption, max 100 kata, pakai emoji.
Iterasi 4: Bikin caption, max 100 kata, pakai emoji,
           diakhiri CTA.</code></pre>
<h2>Kapan Berhenti Iterasi?</h2>
<p>Berhenti kalau:</p>
<ul>
<li>Hasil udah "cukup bagus" (perfect is the enemy of done)</li>
<li>Dua iterasi berturut-turut gak ada improvement</li>
<li>Kamu udah ngabisin waktu lebih dari yang kamu hemat</li>
</ul>
<h2>Log Iterasi (Buat Project Besar)</h2>
<p>Kalau kamu kerjain project serius, catat iterasimu:</p>
<pre><code>V1: Prompt dasar → hasil terlalu umum
V2: + konteks audiens → lebih relevan
V3: + format spesifik → struktur jelas
V4: + few-shot 2 contoh → konsisten
V5: + constraint → selesai ✓</code></pre>
<p>Log ini jadi aset. Next time kamu butuh prompt serupa, tinggal adaptasi dari V5.</p>
<h2>Coba Sendiri</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">Kita bakal iterasi bareng.

1. Aku kasih task
2. Kamu kasih draft V1
3. Aku kasih feedback
4. Kamu kasih V2 (perbaikan dari V1)
5. Ulangi sampai aku bilang stop

Di setiap versi, jelasin:
- Apa yang kamu ubah dari versi sebelumnya
- Kenapa kamu ubah itu

Task: Bikin bio LinkedIn untuk aku.</div></div>
<h2>Poin Kunci</h2>
<ul><li>Prompt = percakapan, bukan sekali jadi</li><li>Ubah 1 variabel per iterasi</li><li>Loop: Try → Check → Fix → Repeat</li><li>Berhenti saat "cukup bagus", jangan kejar perfect</li><li>Catat iterasi buat project besar → jadi aset</li></ul>
<h2>Selanjutnya</h2>
<p>Selamat! Kamu udah lulus Level 2 🎉 Lanjut ke Level 3: <strong>ReAct: Reasoning + Acting</strong>.</p>`,
en:`<h1>Prompt Iteration</h1>
<p>Your first prompt is almost never your best. Great results come from <strong>iteration</strong>.</p>
<h2>Mindset</h2>
<p>Don't treat prompting as "type once, get perfection." Treat it as a <strong>conversation</strong>.</p>
<p>First = draft. Second = revision. Third = usually solid.</p>
<h2>4-Step Iteration Loop</h2>
<pre><code>1. TRY    → Write prompt, run it
2. CHECK  → Good enough? If not, where?
3. FIX    → Fix 1 thing (not everything)
4. REPEAT → Loop until good enough</code></pre>
<h2>7 Iteration Techniques</h2>
<h3>1. "More Like This, Less Like That"</h3>
<pre><code>This version is good in X.
But Y feels too [Z].

Redo with:
- Keep X
- Change Y to [something]</code></pre>
<h3>2. Negative Example</h3>
<pre><code>Here's what I DON'T want:
[bad example]

Here's what I DO want:
[good example]

Now make a new version like the second.</code></pre>
<h3>3. Zoom In</h3>
<pre><code>Everything else is fine. Focus on paragraph 2.

Paragraph 2 is too long. Break it into 3
short sentences, add 1 concrete example.</code></pre>
<h3>4. A/B Compare</h3>
<pre><code>Give me 3 versions:
- A: more formal
- B: more casual
- C: shorter (max 100 words)

I'll pick one, then we polish.</code></pre>
<h3>5. Reverse Engineer</h3>
<pre><code>Here's the output I want: [example]

Analyze: what prompt would produce this?
Then give me that prompt.</code></pre>
<h3>6. Feedback Loop</h3>
<pre><code>Rate your own output:
- Top 3 strengths?
- Top 3 weaknesses?
- If you redid it, what would you change?

Now redo it based on your answers.</code></pre>
<h3>7. Constraint Cascade</h3>
<pre><code>Iter 1: Write a caption.
Iter 2: Write a caption, max 100 words.
Iter 3: Write a caption, max 100 words, with emoji.
Iter 4: Write a caption, max 100 words, with emoji,
        ending with a CTA.</code></pre>
<h2>When to Stop Iterating?</h2>
<ul>
<li>Result is "good enough" (perfect is the enemy of done)</li>
<li>Two iterations in a row show no improvement</li>
<li>You're spending more time than you save</li>
</ul>
<h2>Iteration Log (For Big Projects)</h2>
<pre><code>V1: Basic prompt → too generic
V2: + audience context → more relevant
V3: + specific format → clear structure
V4: + 2 few-shot examples → consistent
V5: + constraints → done ✓</code></pre>
<h2>Try It Yourself</h2>
<div class="prompt-block"><div class="prompt-head"><span class="prompt-label">Prompt</span><button class="prompt-copy" onclick="copyPrompt(this)">Copy</button></div><div class="prompt-body">We'll iterate together.

1. I give a task
2. You give draft V1
3. I give feedback
4. You give V2
5. Repeat until I say stop

For each version, explain:
- What you changed
- Why you changed it

Task: Write a LinkedIn bio for me.</div></div>
<h2>Key Points</h2>
<ul><li>Prompt = conversation, not one-shot</li><li>Change 1 variable per iteration</li><li>Loop: Try → Check → Fix → Repeat</li><li>Stop when "good enough", don't chase perfect</li><li>Log iterations for big projects → asset</li></ul>
<h2>Next</h2>
<p>Congrats! Level 2 done 🎉 On to Level 3: <strong>ReAct</strong>.</p>`
