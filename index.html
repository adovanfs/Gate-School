function renderLibCards(f){if(f.length===0)return `<p style="color:var(--fg-muted);grid-column:1/-1;text-align:center;padding:40px">${t('extras.libEmpty')}</p>`;return f.map(p=>`<button class="lib-card" onclick="showPrompt('${p.t.id.replace(/'/g,"\\'")}')"><div class="lib-cat">${p.c}</div><div class="lib-title">${p.t[state.lang]}</div><div class="lib-desc">${p.d[state.lang]}</div></button>`).join('')}

function analyzePrompt(text){if(!text||text.trim().length<10)return{score:0,strengths:[],weaknesses:['Prompt terlalu pendek.']};const s=text.toLowerCase();let sc=3;const str=[],wk=[];const checks=[{ok:/kamu adalah|you are|act as|sebagai/.test(s),s:1.5,sM:'Ada role/persona',wM:'Tambahin role: "Kamu adalah..."'},{ok:text.length>=100,s:1,sM:'Panjang memadai',wM:'Prompt terlalu pendek'},{ok:/target|audiens|audience|konteks|context|latar/.test(s),s:1.5,sM:'Ada konteks',wM:'Kasih konteks: target audiens'},{ok:/format|output|bullet|tabel|table|json|markdown/.test(s),s:1.5,sM:'Ada format output',wM:'Sebutin format: bullet, tabel, JSON'},{ok:/hindari|jangan|avoid|maksimal|max|minimal|min|wajib|must|hanya/.test(s),s:1,sM:'Ada constraints',wM:'Tambahin batasan'},{ok:/contoh|example|misalnya|seperti/.test(s),s:.5,sM:'Ada contoh',wM:'Tambahin 1-3 contoh'}];checks.forEach(c=>{if(c.ok){sc+=c.s;str.push(c.sM)}else wk.push(c.wM)});return{score:Math.min(10,Math.round(sc*10)/10),strengths:str,weaknesses:wk}}
async function gradeWithAI(prompt,key){const sys='You are a prompt engineering expert. Rate 1-10. Reply ONLY valid JSON: {"score":number,"strengths":["..."],"weaknesses":["..."]}. Max 4 each. Each max 12 words.';const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'openai/gpt-4o-mini',messages:[{role:'system',content:sys},{role:'user',content:prompt}],response_format:{type:'json_object'}})});if(!r.ok)throw new Error('API '+r.status);const d=await r.json();return JSON.parse(d.choices[0].message.content)}
window.gradePrompt=async function(){const i=document.getElementById('gradeInput'),a=document.getElementById('gradeApi'),r=document.getElementById('gradeResult'),b=document.getElementById('gradeBtn');const txt=i.value.trim();if(!txt){toast(t('extras.graderEmpty'),'warning');return}const k=a.value.trim();if(k)localStorage.setItem('gs.apikey',k);b.disabled=true;const o=b.textContent;b.textContent=t('extras.graderAnalyzing');r.innerHTML='';let d,m;try{if(k){d=await gradeWithAI(txt,k);m='ai'}else{d=analyzePrompt(txt);m='offline'}}catch(e){toast('API: '+e.message,'error');d=analyzePrompt(txt);m='offline'}b.disabled=false;b.textContent=o;const pct=Math.min(100,d.score*10);const col=d.score>=8?'var(--success)':d.score>=5?'var(--warning)':'var(--danger)';r.innerHTML=`<div class="grader-feedback"><div class="grader-score-wrap"><div class="grader-score" style="color:${col};-webkit-text-fill-color:${col}">${d.score}</div><div class="grader-score-lbl">${t('extras.graderScore')} / 10 · ${m==='ai'?t('extras.graderAI'):t('extras.graderOffline')}</div></div><div class="grader-meter"><span>${t('extras.graderScore')}</span><div class="bar"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div><span>${d.score}/10</span></div>${d.strengths&&d.strengths.length?`<div class="grader-feedback grader-ok" style="margin-top:24px"><h4>${t('extras.graderStrengths')}</h4><ul>${d.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>`:''}${d.weaknesses&&d.weaknesses.length?`<div class="grader-feedback grader-warn" style="margin-top:16px"><h4>${t('extras.graderWeaknesses')}</h4><ul>${d.weaknesses.map(w=>`<li>${w}</li>`).join('')}</ul></div>`:''}</div>`;if(d.score>=8)confetti()}

function renderNav(){const routes=[['#/','home'],['#/kurikulum','curriculum'],['#/extras','extras'],['#/progress','progress'],['#/tentang','about']];const cur=location.hash||'#/';document.getElementById('nav').innerHTML=routes.map(([h,k])=>{const on=(cur===h||(h!=='#/'&&cur.startsWith(h)))?'on':'';return `<a href="${h}" class="${on}">${t('nav.'+k)}</a>`}).join('')}
function renderHeader(){document.querySelector('[data-i="brand"]').textContent=t('brand');document.getElementById('langBtn').textContent=state.lang==='id'?'🇮🇩':'🇬🇧';document.getElementById('themeBtn').textContent=state.theme==='dark'?'☀️':'🌙';document.querySelectorAll('[data-i="madeWith"]').forEach(e=>e.textContent=t('madeWith'))}

function renderHome(){const total=totalLessons();return `<section class="hero"><div class="badge"><span class="badge-dot"></span>${t('hero.badge')}</div><h1>${t('hero.title1')}<br><em>${t('hero.title2')}</em></h1><p class="hero-sub">${t('hero.sub')}</p><div class="hero-cta"><a href="#/kurikulum/level-1/01-apa-itu-ai" class="btn btn-p">${t('hero.ctaPrimary')} →</a><button class="btn btn-g" onclick="scrollToSection('kurikulum')">${t('hero.ctaSecondary')}</button></div><div class="stack"><div class="stack-card"><div class="stack-label">Level 03 · Advanced</div><div class="stack-title">Chain of Thought</div><div class="stack-meta"><span>ReAct · ToT</span><span>12 min</span></div></div><div class="stack-card"><div class="stack-label">Level 02 · Intermediate</div><div class="stack-title">Few-Shot Prompting</div><div class="stack-meta"><span>Role · Format</span><span>8 min</span></div></div><div class="stack-card"><div class="stack-label">${state.lang==='id'?'Level 01 · Pemula':'Level 01 · Beginner'}</div><div class="stack-title">${state.lang==='id'?'Anatomi Prompt':'Anatomy of a Prompt'}</div><div class="stack-meta"><span>${state.lang==='id'?'Mulai dari sini':'Start here'}</span><span>5 min</span></div></div></div><div class="stats"><div class="stat reveal"><div class="stat-val">5</div><div class="stat-lbl">${t('stats.levels')}</div></div><div class="stat reveal"><div class="stat-val">${total}</div><div class="stat-lbl">${t('stats.lessons')}</div></div><div class="stat reveal"><div class="stat-val">100%</div><div class="stat-lbl">${t('stats.free')}</div></div></div></section><section class="section" id="kurikulum"><div class="container"><div class="sec-head reveal"><div class="sec-eye">${t('curriculum.eyebrow')}</div><h2 class="sec-title">${t('curriculum.title')}</h2><p class="sec-sub">${t('curriculum.sub')}</p></div><div class="levels">${CURRICULUM.map(l=>{const p=levelProg(l);return `<a href="#/kurikulum/${l.id}" class="lvl reveal"><div class="lvl-num">LEVEL ${l.num}</div><h3 class="lvl-title">${l.title[state.lang]}</h3><p class="lvl-desc">${l.desc[state.lang]}</p><div class="lvl-prog"><div class="bar"><div class="bar-fill" style="width:${p.percent}%"></div></div><span class="bar-txt">${p.done}/${p.total}</span></div></a>`}).join('')}</div></div></section>`}

function renderLevel(id){const lvl=CURRICULUM.find(l=>l.id===id);if(!lvl)return render404();const p=levelProg(lvl);return `<div class="lesson"><div class="crumb reveal"><a href="#/">${t('nav.home')}</a><span>›</span><span>Level ${lvl.num}</span></div><h1 class="reveal">${lvl.title[state.lang]}</h1><p class="reveal" style="color:var(--fg-soft);font-size:1.1rem;margin-bottom:32px;max-width:600px">${lvl.desc[state.lang]}</p><div class="lvl-prog reveal" style="margin-bottom:40px"><div class="bar"><div class="bar-fill" style="width:${p.percent}%"></div></div><span class="bar-txt">${p.done}/${p.total}</span></div><div class="lesson-list reveal">${lvl.lessons.map((x,i)=>{const d=isDone(lvl.id,x.slug);return `<a href="#/kurikulum/${lvl.id}/${x.slug}" class="lesson-row"><span class="lesson-num ${d?'done':''}">${d?'✓':String(i+1).padStart(2,'0')}</span><span class="lesson-tit">${x.title[state.lang]}</span><span class="lesson-arrow">→</span></a>`}).join('')}</div></div>`}

function renderLesson(lid,slug){const lvl=CURRICULUM.find(l=>l.id===lid);if(!lvl)return render404();const idx=lvl.lessons.findIndex(x=>x.slug===slug);if(idx<0)return render404();const lesson=lvl.lessons[idx];const prev=idx>0?lvl.lessons[idx-1]:null;const next=idx<lvl.lessons.length-1?lvl.lessons[idx+1]:null;const key=lid+'/'+slug;const content=LESSONS[key]?.[state.lang]||LESSONS[key]?.id;const quiz=QUIZ[key];const done=isDone(lid,slug);const bm=isBookmarked(lid,slug);const fb=!LESSONS[key]?.[state.lang]&&LESSONS[key]?.id;const rt=content?readingTime(content):5;return `<div class="lesson"><div class="crumb reveal"><a href="#/">${t('nav.home')}</a><span>›</span><a href="#/kurikulum/${lid}">Level ${lvl.num}</a><span>›</span><span>${lesson.title[state.lang]}</span></div><h1 class="reveal">${lesson.title[state.lang]}</h1><div class="lesson-meta reveal"><span>${lvl.title[state.lang]}</span><span>·</span><span>${rt} ${t('lesson.minRead')}</span>${fb?'<span>·</span><span style="color:var(--warning)">EN soon</span>':''}<button class="bookmark-btn ${bm?'on':''}" onclick="toggleBookmark('${lid}','${slug}')">${bm?'★':'☆'} ${bm?t('lesson.bookmarked'):t('lesson.bookmark')}</button></div><div class="prose reveal">${content||`<p style="color:var(--fg-soft);padding:40px 0">${t('comingSoon')}</p>`}</div>${content?`<div class="pg reveal"><div class="pg-head"><span class="pg-dot"></span><span class="pg-title">${t('lesson.playground')}</span></div><textarea id="pgArea" placeholder="${t('lesson.playgroundHint')}"></textarea><div class="pg-actions"><span class="pg-hint" id="pgCount">0 karakter</span><div style="display:flex;gap:8px"><button class="btn btn-g btn-sm" onclick="clearPlayground()">Clear</button><button class="btn btn-p btn-sm" onclick="copyPlayground(this)">${t('lesson.copy')}</button></div></div></div>`:''}${content&&quiz?renderQuiz(key,quiz):''}${content?`<div class="complete reveal"><h3>${done?t('lesson.completed'):(state.lang==='id'?'Sudah paham?':'Got it?')}</h3><p>${state.lang==='id'?'Tandai selesai untuk lanjut.':'Mark complete to continue.'}</p><button class="btn ${done?'btn-g':'btn-p'}" id="completeBtn">${done?t('lesson.completed'):t('lesson.complete')}</button></div>`:''}<nav class="nav-btns reveal">${prev?`<a href="#/kurikulum/${lid}/${prev.slug}" class="nav-btn"><span class="nav-lbl">← ${t('lesson.prev')}</span><span class="nav-tit">${prev.title[state.lang]}</span></a>`:'<div></div>'}${next?`<a href="#/kurikulum/${lid}/${next.slug}" class="nav-btn next"><span class="nav-lbl">${t('lesson.next')} →</span><span class="nav-tit">${next.title[state.lang]}</span></a>`:'<div></div>'}</nav></div>`}

function renderQuiz(key,qs2){const qs=state.quizState[key]||{i:0,sel:null,score:0,done:false};state.quizState[key]=qs;if(qs.done){const p=Math.round(qs.score/qs2.length*100);return `<div class="quiz reveal"><div class="quiz-head"><span class="quiz-label">${t('quiz.finish')}</span></div><div style="text-align:center;padding:20px 0"><div style="font-size:2.5rem;font-weight:700;margin-bottom:8px;color:var(--fg)">${qs.score}/${qs2.length}</div><p style="color:var(--fg-soft)">${p===100?'🎉':p>=60?'👍':'📚'}</p><button class="btn btn-g btn-sm" style="margin-top:20px" onclick="resetQuiz('${key}')">↺</button></div></div>`}const q=qs2[qs.i];const qT=q.q[state.lang],opts=q.o[state.lang];return `<div class="quiz reveal"><div class="quiz-head"><span class="quiz-label">${t('quiz.label')}</span><span class="quiz-count">${qs.i+1}/${qs2.length}</span></div><div class="quiz-q">${qT}</div><div class="quiz-opts">${opts.map((o,i)=>{let c='quiz-opt';if(qs.sel!==null){if(i===q.c)c+=' right';else if(i===qs.sel)c+=' wrong'}return `<button class="${c}" onclick="answerQuiz('${key}',${i},${q.c})"><span class="quiz-marker">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`}).join('')}</div>${qs.sel!==null?`<div class="quiz-footer"><span class="quiz-fb ${qs.sel===q.c?'ok':'no'}">${qs.sel===q.c?t('quiz.correct'):t('quiz.wrong')}</span><button class="btn btn-p btn-sm" onclick="nextQuiz('${key}',${qs2.length})">${qs.i===qs2.length-1?t('quiz.finish'):t('quiz.next')}</button></div>`:''}</div>`}

function renderProgress(){const total=totalLessons(),done=totalDone();const pct=total?done/total*100:0;const r=45,c=2*Math.PI*r,d=pct/100*c;return `<div class="lesson"><h1 class="reveal">${t('progress.title')}</h1><p class="reveal" style="color:var(--fg-soft);margin-bottom:40px;max-width:600px">${t('progress.sub')}</p><div class="stat-row reveal"><div class="ring"><svg width="100" height="100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--border)" stroke-width="8"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${d} ${c}" style="transition:stroke-dasharray .6s var(--ease)"/></svg><div class="ring-val">${Math.round(pct)}%</div></div><div><div style="font-size:28px;font-weight:700;color:var(--fg)">${done} / ${total}</div><div style="color:var(--fg-soft);font-size:14px">${t('progress.completed')}</div></div></div><div class="reveal" style="display:flex;flex-direction:column;gap:10px;margin-bottom:40px">${CURRICULUM.map(l=>{const p=levelProg(l);return `<div style="display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:14px;background:var(--card);border:1px solid var(--border)"><span style="font-family:var(--mono);font-size:12px;color:var(--fg-muted);min-width:24px">${l.num}</span><span style="flex:1;font-weight:500;font-size:14px;color:var(--fg)">${l.title[state.lang]}</span><div class="bar" style="width:100px"><div class="bar-fill" style="width:${p.percent}%"></div></div><span style="font-size:12px;color:var(--fg-muted);min-width:36px;text-align:right">${p.done}/${p.total}</span></div>`}).join('')}</div><button class="btn btn-g reveal" id="resetBtn" style="color:var(--danger)">${t('progress.reset')}</button></div>`}

function renderAbout(){return `<div class="lesson"><h1 class="reveal" style="text-align:center;margin-bottom:32px">${t('about.title')}</h1><div class="prose reveal">${t('about.body')}</div></div>`}

function renderExtras(){const tabs=[{id:'library',l:t('extras.tabLibrary')},{id:'cheat',l:t('extras.tabCheat')},{id:'grader',l:t('extras.tabGrader')}];let body='';if(state.extrasTab==='library'){const cats=['All',...new Set(PROMPT_LIBRARY.map(p=>p.c))];const q=state.libQ.toLowerCase().trim();const f=PROMPT_LIBRARY.filter(p=>{const ok=state.libCat==='All'||p.c===state.libCat;if(!ok)return false;if(!q)return true;return(p.t[state.lang]+' '+p.d[state.lang]).toLowerCase().includes(q)});body=`<h1>${t('extras.libTitle')}</h1><p class="page-sub" style="color:var(--fg-soft);margin-bottom:24px">${t('extras.libSub')}</p><input class="lib-search" type="text" placeholder="${t('extras.libSearch')}" value="${state.libQ.replace(/"/g,'&quot;')}" oninput="libSearch(this.value)"><div class="lib-filters">${cats.map(c=>`<button class="lib-chip ${state.libCat===c?'on':''}" onclick="libFilter('${c}')">${c==='All'?t('extras.libAll'):c}</button>`).join('')}</div><div class="lib-grid">${renderLibCards(f)}</div>`}else if(state.extrasTab==='cheat'){const cheat=state.lang==='id'?[{i:'🧬',h:'Anatomi Prompt',it:[['<strong>Role</strong>','Siapa AI: "Kamu adalah..."'],['<strong>Task</strong>','Aksi spesifik'],['<strong>Context</strong>','Latar, audiens'],['<strong>Format</strong>','Bullet, tabel, JSON'],['<strong>Examples</strong>','1-3 contoh'],['<strong>Constraints</strong>','Batasan']]},{i:'⚡',h:'Teknik Utama',it:[['<strong>Zero-shot</strong>','Tanpa contoh'],['<strong>Few-shot</strong>','3-5 contoh'],['<strong>CoT</strong>','"Think step by step"'],['<strong>Role</strong>','Assign persona'],['<strong>ReAct</strong>','Reasoning + Acting'],['<strong>Meta</strong>','AI bikin prompt']]},{i:'⚠️',h:'Kesalahan Umum',it:[['<strong>Vague</strong>','"Bikin konten bagus"'],['<strong>No context</strong>','AI nebak'],['<strong>Multi-task</strong>','Numpuk 5 task'],['<strong>No format</strong>','Tembok teks'],['<strong>No iterate</strong>','Sekali jadi'],['<strong>Blind trust</strong>','Gak verifikasi']]},{i:'🔄',h:'Alur Kerja',it:[['<strong>1. Simple</strong>','Prompt 4 kata'],['<strong>2. +Role</strong>','"Kamu adalah..."'],['<strong>3. +Context</strong>','Audiens, tujuan'],['<strong>4. +Format</strong>','Output shape'],['<strong>5. +Constraints</strong>','Batasan'],['<strong>6. Iterate</strong>','Test → refine']]}]:[{i:'🧬',h:'Prompt Anatomy',it:[['<strong>Role</strong>','"You are..."'],['<strong>Task</strong>','Specific action'],['<strong>Context</strong>','Background, audience'],['<strong>Format</strong>','Bullets, table, JSON'],['<strong>Examples</strong>','1-3 samples'],['<strong>Constraints</strong>','Limits']]},{i:'⚡',h:'Core Techniques',it:[['<strong>Zero-shot</strong>','No examples'],['<strong>Few-shot</strong>','3-5 examples'],['<strong>CoT</strong>','"Think step by step"'],['<strong>Role</strong>','Assign persona'],['<strong>ReAct</strong>','Reasoning + Acting'],['<strong>Meta</strong>','AI writes prompts']]},{i:'⚠️',h:'Common Mistakes',it:[['<strong>Vague</strong>','"Make good content"'],['<strong>No context</strong>','AI guesses'],['<strong>Multi-task</strong>','5 tasks at once'],['<strong>No format</strong>','Wall of text'],['<strong>No iterate</strong>','One-shot'],['<strong>Blind trust</strong>','No verify']]},{i:'🔄',h:'Workflow',it:[['<strong>1. Simple</strong>','4-word prompt'],['<strong>2. +Role</strong>','"You are..."'],['<strong>3. +Context</strong>','Audience, goal'],['<strong>4. +Format</strong>','Output shape'],['<strong>5. +Constraints</strong>','Limits'],['<strong>6. Iterate</strong>','Test → refine']]}];body=`<h1>${t('extras.cheatTitle')}</h1><p style="color:var(--fg-soft);margin-bottom:32px">${t('extras.cheatSub')}</p><div class="cheat-grid">${cheat.map(c=>`<div class="cheat-card"><h3><span>${c.i}</span><span>${c.h}</span></h3><ul>${c.it.map(([k,v])=>`<li>${k}${v}</li>`).join('')}</ul></div>`).join('')}</div>`}else{const saved=localStorage.getItem('gs.apikey')||'';body=`<h1>${t('extras.graderTitle')}</h1><p style="color:var(--fg-soft);margin-bottom:24px">${t('extras.graderSub')}</p><div class="pg"><div class="pg-head"><span class="pg-dot"></span><span class="pg-title">${state.lang==='id'?'Prompt Kamu':'Your Prompt'}</span></div><textarea id="gradeInput" placeholder="${t('extras.graderPlaceholder')}" style="min-height:180px"></textarea><div class="pg-actions"><span class="pg-hint" id="gradeCount">0 karakter</span><button class="btn btn-p btn-sm" id="gradeBtn">${t('extras.graderBtn')} →</button></div></div><div class="grader-api"><p>${t('extras.graderApiNote')}</p><input type="password" id="gradeApi" placeholder="${t('extras.graderApiPlaceholder')}" value="${saved.replace(/"/g,'&quot;')}"></div><div id="gradeResult"></div>`}return `<div class="lesson" style="max-width:1000px"><div class="tabs">${tabs.map(x=>`<button class="tab ${state.extrasTab===x.id?'on':''}" onclick="switchExtrasTab('${x.id}')">${x.l}</button>`).join('')}</div>${body}</div>`}

function render404(){return `<div class="container" style="padding:120px 24px;text-align:center"><div style="font-size:5rem;font-weight:700;background:linear-gradient(180deg,var(--fg),var(--fg-muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent">404</div><p style="color:var(--fg-soft);margin:16px 0 32px">${t('notFound')}</p><a href="#/" class="btn btn-p">${t('backHome')}</a></div>`}

function render(){document.documentElement.setAttribute('data-theme',state.theme);document.documentElement.setAttribute('lang',state.lang);renderHeader();renderNav();const hash=location.hash.replace(/^#/,'')||'/';const parts=hash.split('/').filter(Boolean);const main=document.getElementById('main');let html='';if(parts.length===0)html=renderHome();else if(parts[0]==='kurikulum'){if(parts.length===1)html=renderHome();else if(parts.length===2)html=renderLevel(parts[1]);else if(parts.length===3)html=renderLesson(parts[1],parts[2]);else html=render404()}else if(parts[0]==='extras')html=renderExtras();else if(parts[0]==='progress')html=renderProgress();else if(parts[0]==='tentang')html=renderAbout();else html=render404();main.innerHTML=html;
const pg=document.getElementById('pgArea');if(pg)pg.addEventListener('input',()=>{document.getElementById('pgCount').textContent=pg.value.length+' karakter'});
const gi=document.getElementById('gradeInput');if(gi){gi.addEventListener('input',()=>{document.getElementById('gradeCount').textContent=gi.value.length+' karakter'});document.getElementById('gradeBtn').addEventListener('click',()=>window.gradePrompt())}
const cb=document.getElementById('completeBtn');if(cb){const hp=location.hash.replace(/^#/,'').split('/').filter(Boolean);if(hp.length===3){const lid=hp[1],slug=hp[2];cb.addEventListener('click',()=>{if(isDone(lid,slug))unmarkDone(lid,slug);else{markDone(lid,slug);confetti();toast(state.lang==='id'?'🎉 Selesai!':'🎉 Complete!','success')}render()})}}
const rb=document.getElementById('resetBtn');if(rb){rb.addEventListener('click',async()=>{const ok=await showModal({title:t('progress.resetConfirm'),message:t('progress.resetDesc'),icon:'⚠',iconType:'danger',confirmText:t('toast.confirmReset'),cancelText:state.lang==='id'?'Batal':'Cancel',danger:true});if(ok){state.progress={completed:{},bookmarks:{}};save();toast(t('toast.resetOk'),'success');render()}})}
const cur=location.hash||'#/';const isNew=cur!==lastRenderedHash;lastRenderedHash=cur;if(isNew&&cur!=='#/kurikulum')window.scrollTo(0,0);if(isNew)setupReveal();else requestAnimationFrame(()=>document.querySelectorAll('.reveal').forEach(e=>e.classList.add('visible')));requestAnimationFrame(()=>{updateScrollProgress();updateHeaderState()})}

function confetti(){const c=document.createElement('div');c.className='confetti';document.body.appendChild(c);const cols=['#fff','#a0a0a0','#ffd60a','#30d158','#5e9eff'];for(let i=0;i<40;i++){const p=document.createElement('div');p.className='cf';p.style.left=Math.random()*100+'%';p.style.background=cols[Math.floor(Math.random()*cols.length)];p.style.width=(6+Math.random()*8)+'px';p.style.height=p.style.width;p.style.animationDelay=(Math.random()*.3)+'s';p.style.animationDuration=(2+Math.random()*1.5)+'s';c.appendChild(p)}setTimeout(()=>c.remove(),3500)}

document.getElementById('langBtn').addEventListener('click',()=>{state.lang=state.lang==='id'?'en':'id';save();render()});
document.getElementById('themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()});
window.addEventListener('hashchange',()=>{render();if(location.hash==='#/kurikulum'){setTimeout(()=>{const el=document.getElementById('kurikulum');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},120)}});
document.addEventListener('keydown',(e)=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;const parts=location.hash.replace(/^#/,'').split('/').filter(Boolean);if(parts.length===3&&parts[0]==='kurikulum'){const lid=parts[1],slug=parts[2];const lvl=CURRICULUM.find(l=>l.id===lid);if(!lvl)return;const idx=lvl.lessons.findIndex(x=>x.slug===slug);if(e.key==='ArrowLeft'&&idx>0)location.hash=`#/kurikulum/${lid}/${lvl.lessons[idx-1].slug}`;if(e.key==='ArrowRight'&&idx<lvl.lessons.length-1)location.hash=`#/kurikulum/${lid}/${lvl.lessons[idx+1].slug}`}});
render();

</script>
</body>
</html>
